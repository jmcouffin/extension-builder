<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyRevit Extension Builder</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="logo.svg" alt="pyRevit Logo" width="198" height="218">
            <div class="logo-text">
                <h1 class="glowing-text-title">pyRevit</h1>
                <span class="glowing-text-title">extension builder</span>
            </div>
        </div>
        <div class="download-button">
            <div class="pixel-container">
                <div class="pixel-border">
                    <button id="loadConfig" class="load-button">
                        LOAD LAYOUT <span class="load-icon">&#x1F5BF;</span>
                    </button>
                </div>
            </div>
            <div class="pixel-container">
                <div class="pixel-border">
                    <button id="saveConfig" class="save-button">
                        SAVE LAYOUT <span class="save-icon">&#x1F5AA;</span>
                    </button>
                </div>
            </div>
            <div class="pixel-container">
                <div class="pixel-border">
                    <button class="reset-button" id="resetToolbar">
                        RESET <span class="reset-icon">&#x21BB;</span>
                    </button>
                </div>
            </div>
            <div class="pixel-container">
                <div class="pixel-border">
                    <button class="glowing-text-slow" id="downloadZip">
                        DOWNLOAD
                        <span class="download-icon">&#x2B07;</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="extension-name">
        <div class="pixel-container">
            <div class="pixel-border">
                <div class="pixel-content">
                    <input class="glowing-text" type="text" id="extensionName" value="My Extension">
                </div>
            </div>
        </div>
    </div>

    <main>
        <div class="tabs-container">
            <div class="tabs" id="tabsContainer"></div>
            <button class="add-button" id="addTab">
                <span class="plus">+</span>TAB
            </button>
        </div>

        <div class="ribbon-container">
            <div class="ribbon" id="ribbonContainer"></div>
        </div>

        <div class="add-panel-container">
            <button class="add-button" id="addPanel">
                <span class="plus">+</span>PANEL
            </button>
        </div>

        <div class="pulldown-content-container" id="pulldownContentContainer"></div>
    </main>

    <div class="pixel-container">
        <div class="pixel-border">
            <div class="extension-preview">
                <div class="preview-header">EXTENSION FOLDER PREVIEW</div>
                <div class="preview-content" id="folderPreview"></div>
            </div>
        </div>
    </div>

    <!-- Modal for creating and editing a bundle -->
    <div class="modal" id="buttonModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modalTitle">New Command</h2>

            <h3 class="modal-section-title">Bundle Type</h3>
            <div id="buttonTypeGrid"></div>
            <div class="type-note" id="typeNote" style="display:none;"></div>

            <div class="modal-grid">
                <div class="form-group span-2">
                    <label for="buttonName">Name (required)</label>
                    <input type="text" id="buttonName" placeholder="Button 1">
                </div>

                <div class="form-group">
                    <label for="buttonTitle">Title</label>
                    <input type="text" id="buttonTitle" placeholder="Defaults to name">
                </div>

                <div class="form-group span-3">
                    <label for="buttonTooltip">Tooltip</label>
                    <input type="text" id="buttonTooltip" placeholder="Shown on hover">
                </div>

                <div class="form-group" id="buttonIconGroup">
                    <label for="buttonIcon">Icon</label>
                    <div class="icon-upload">
                        <input type="file" id="buttonIcon" accept="image/png,image/jpeg,image/gif,image/bmp,image/svg+xml">
                        <div class="icon-preview" id="iconPreview"></div>
                    </div>
                </div>

                <div class="form-group" id="onIconGroup" style="display:none;">
                    <label for="buttonOnIcon">On-state Icon</label>
                    <div class="icon-upload">
                        <input type="file" id="buttonOnIcon" accept="image/png,image/jpeg,image/gif,image/bmp,image/svg+xml">
                        <div class="icon-preview" id="onIconPreview"></div>
                    </div>
                </div>

                <div class="form-group span-3" id="buttonCodeGroup">
                    <label for="buttonCode">Python</label>
                    <textarea id="buttonCode" placeholder="Leave empty for a starter script."></textarea>
                </div>
            </div>

            <details class="advanced-disclosure" id="advancedDisclosure">
                <summary>Advanced <span class="advanced-hint">(bundle.yaml)</span></summary>
                <div class="advanced-body" id="advancedBody">
                    <div id="advancedFields"></div>
                    <div class="form-group" id="darkIconGroup">
                        <label for="buttonDarkIcon">Dark-theme Icon</label>
                        <input type="file" id="buttonDarkIcon" accept="image/png,image/jpeg,image/gif,image/bmp,image/svg+xml">
                    </div>
                </div>
            </details>

            <div class="modal-actions">
                <button id="createButton">Create</button>
                <button class="cancel-button">Cancel</button>
            </div>
        </div>
    </div>

    <script src="bundle-types.js"></script>
    <script src="template.js"></script>
    <script src="state.js"></script>
    <script src="folder-structure.js"></script>
    <script src="drag-drop.js"></script>
    <script src="ui-elements.js"></script>
    <script src="modal-handlers.js"></script>
    <script src="event-handlers.js"></script>
    <script src="save-load.js"></script>
    <script src="draft.js"></script>
    <script src="app.js"></script>
</body>

</html>
