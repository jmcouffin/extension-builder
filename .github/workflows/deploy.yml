name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7

  # Publishing writes the `build` branch, which every run shares: the root
  # from main, and pr-<n>/ for each pull request. One run at a time, and a
  # publish is never cancelled half-way.
  publish:
    needs: build
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Publish the site root
        if: github.event_name != 'pull_request'
        run: bash scripts/publish-pages.sh main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the pull request preview
        if: github.event_name == 'pull_request'
        run: bash scripts/publish-pages.sh pr "${{ github.event.pull_request.number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link the preview from the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const domain = fs.existsSync("public/CNAME")
              ? fs.readFileSync("public/CNAME", "utf8").trim()
              : "";
            const site = domain
              ? `https://${domain}`
              : `https://${context.repo.owner}.github.io/${context.repo.repo}`;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = "<!-- pages-preview -->";
            const body = [
              marker,
              `**Preview:** ${site}/pr-${number}/`,
              "",
              `Built from ${sha}. GitHub Pages can take a minute or two to pick up a new build. The preview is removed when the pull request is closed.`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: number,
              per_page: 100,
            });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }
